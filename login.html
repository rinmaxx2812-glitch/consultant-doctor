<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Consultant Doctor</title>
    <link rel="shortcut icon" href="./logo copy.png" type="image/x-icon">
    <link rel="stylesheet" href="login.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <div class="login-page">
        <div class="bg-dots"></div>

        <!-- Back to Home Link -->
        <a href="index.html" class="back-home">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>

        <!-- Login Card -->
        <div class="login-card">
            <!-- Brand Header -->
            <div class="login-header">
                <div class="medical-logo"></div>
                <h1>Consultant <strong>Doctor</strong></h1>
                <p class="subtitle">Admin Portal • Doctor & System Access</p>
            </div>

            <!-- Login Form -->
            <form id="adminLoginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Admin Username</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user-doctor"></i>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            placeholder="Enter doctor username" 
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="password">Password</label>
                    </div>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Enter password" 
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Show or hide password">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember session</span>
                    </label>
                    <span class="portal-tag"><i class="fa-solid fa-shield-halved"></i> Protected</span>
                </div>

                <!-- Error / Status Message Box -->
                <div id="loginMessage" class="alert-message" role="alert"></div>

                <button type="submit" class="btn-submit">
                    <span>Sign In to Dashboard</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <!-- Footer Note -->
            <div class="login-footer">
                <p>Authorized medical personnel only</p>
            </div>
        </div>
    </div>

    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            togglePassword.innerHTML = isPassword
                ? '<i class="fa-regular fa-eye-slash"></i>'
                : '<i class="fa-regular fa-eye"></i>';
        });

        const loginForm = document.getElementById('adminLoginForm');
        const loginMessage = document.getElementById('loginMessage');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (username === 'DrLaYaung' && password === '482048') {
                sessionStorage.setItem('consultant_admin_auth', 'true');
                loginMessage.className = 'alert-message success';
                loginMessage.innerHTML = '<i class="fa-solid fa-circle-check"></i> Login successful! Redirecting to dashboard...';
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 400);
            } else {
                loginMessage.className = 'alert-message error';
                loginMessage.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Invalid username or password.';
            }
        });
    </script>
</body>
</html>
